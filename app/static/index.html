<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoShare — Вебінтерфейс</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .photo-card img { height: 220px; object-fit: cover; }
        .badge-tag { margin-right: 4px; cursor: pointer; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">PhotoShare</a>
        <div class="d-flex align-items-center gap-2" id="nav-auth-area">
            <span class="text-light small me-2" id="current-user-badge">Гість</span>
            <button class="btn btn-outline-light btn-sm" id="btn-logout" style="display:none;" onclick="logout()">Вийти</button>
        </div>
    </div>
</nav>

<div class="container">
    <div id="alert-box"></div>

    <!-- Блок авторизації / реєстрації -->
    <div class="row mb-4" id="auth-section">
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">Реєстрація (1-й користувач = Admin)</div>
                <div class="card-body">
                    <form onsubmit="registerUser(event)">
                        <div class="mb-2">
                            <input type="text" class="form-control" id="reg-username" placeholder="Username (мін. 3 символи)" required>
                        </div>
                        <div class="mb-2">
                            <input type="email" class="form-control" id="reg-email" placeholder="Email" required>
                        </div>
                        <div class="mb-2">
                            <input type="text" class="form-control" id="reg-fullname" placeholder="Повне ім'я (необов'язково)">
                        </div>
                        <div class="mb-2">
                            <input type="password" class="form-control" id="reg-password" placeholder="Пароль (мін. 6 символів)" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">Вхід у систему</div>
                <div class="card-body">
                    <form onsubmit="loginUser(event)">
                        <div class="mb-2">
                            <input type="text" class="form-control" id="login-username" placeholder="Username" required>
                        </div>
                        <div class="mb-2">
                            <input type="password" class="form-control" id="login-password" placeholder="Пароль" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Увійти</button>
                    </form>
                    <hr>
                    <a href="/docs" target="_blank" class="btn btn-outline-secondary btn-sm w-100">Відкрити Swagger API (/docs)</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Робоча зона авторизованого користувача -->
    <div id="app-section" style="display:none;">
        <div class="row mb-4">
            <!-- Завантаження фото -->
            <div class="col-md-5 mb-3">
                <div class="card shadow-sm">
                    <div class="card-header fw-bold">Завантажити світлину</div>
                    <div class="card-body">
                        <form onsubmit="uploadPhoto(event)">
                            <div class="mb-2">
                                <input type="file" class="form-control" id="photo-file" accept="image/*" required>
                            </div>
                            <div class="mb-2">
                                <input type="text" class="form-control" id="photo-desc" placeholder="Опис світлини">
                            </div>
                            <div class="mb-2">
                                <input type="text" class="form-control" id="photo-tags" placeholder="Теги через кому (до 5, напр.: nature, sun)">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Завантажити</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Пошук та фільтрація -->
            <div class="col-md-7 mb-3">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold">Пошук та фільтрація світлин</div>
                    <div class="card-body">
                        <form onsubmit="searchPhotos(event)" class="row g-2">
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="search-keyword" placeholder="Ключове слово в описі">
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="search-tag" placeholder="Тег">
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="search-sort">
                                    <option value="date">Сортувати: за датою</option>
                                    <option value="rating">Сортувати: за рейтингом</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="search-order">
                                    <option value="desc">За спаданням</option>
                                    <option value="asc">За зростанням</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-dark w-100">Знайти</button>
                            </div>
                        </form>
                        <div class="mt-3 small text-muted" id="profile-summary"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Галерея світлин -->
        <h4 class="mb-3">Світлини</h4>
        <div class="row" id="photos-grid"></div>
    </div>
</div>

<!-- Модальне вікно для коментарів та QR-трансформацій -->
<div class="modal fade" id="photoModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">Деталі світлини</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentUser = null;
    const modalInstance = new bootstrap.Modal(document.getElementById('photoModal'));

    function getToken() {
        return localStorage.getItem('access_token');
    }

    function showAlert(message, type = 'info') {
        const box = document.getElementById('alert-box');
        box.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    }

    async function apiFetch(url, options = {}) {
        const headers = options.headers || {};
        const token = getToken();
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
        const res = await fetch(url, { ...options, headers });
        if (res.status === 204) return null;
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            throw new Error(data.detail || 'Помилка запиту');
        }
        return data;
    }

    async function registerUser(e) {
        e.preventDefault();
        try {
            const payload = {
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                full_name: document.getElementById('reg-fullname').value || null,
                password: document.getElementById('reg-password').value
            };
            const user = await apiFetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            showAlert(`Користувача <b>${user.username}</b> зареєстровано з роллю <b>${user.role}</b>! Тепер увійдіть.`, 'success');
            e.target.reset();
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function loginUser(e) {
        e.preventDefault();
        try {
            const form = new URLSearchParams();
            form.append('username', document.getElementById('login-username').value);
            form.append('password', document.getElementById('login-password').value);

            const data = await apiFetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: form
            });
            localStorage.setItem('access_token', data.access_token);
            await initApp();
            showAlert('Успішний вхід!', 'success');
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function logout() {
        try {
            await apiFetch('/api/auth/logout', { method: 'POST' });
        } catch (_) {}
        localStorage.removeItem('access_token');
        currentUser = null;
        document.getElementById('auth-section').style.display = 'flex';
        document.getElementById('app-section').style.display = 'none';
        document.getElementById('btn-logout').style.display = 'none';
        document.getElementById('current-user-badge').textContent = 'Гість';
        showAlert('Ви вийшли із системи.', 'secondary');
    }

    async function initApp() {
        if (!getToken()) return;
        try {
            currentUser = await apiFetch('/api/users/me');
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('btn-logout').style.display = 'inline-block';
            document.getElementById('current-user-badge').textContent = `${currentUser.username} (${currentUser.role})`;
            document.getElementById('profile-summary').innerHTML =
                `Профіль: <b>${currentUser.username}</b> | Роль: <span class="badge bg-info text-dark">${currentUser.role}</span> | Завантажено фото: <b>${currentUser.photos_count}</b>`;
            await loadPhotos();
        } catch (err) {
            localStorage.removeItem('access_token');
        }
    }

    async function uploadPhoto(e) {
        e.preventDefault();
        try {
            const formData = new FormData();
            formData.append('file', document.getElementById('photo-file').files[0]);
            const desc = document.getElementById('photo-desc').value;
            const tags = document.getElementById('photo-tags').value;
            if (desc) formData.append('description', desc);
            if (tags) formData.append('tags', tags);

            await apiFetch('/api/photos/', { method: 'POST', body: formData });
            e.target.reset();
            showAlert('Світлину успішно завантажено!', 'success');
            await initApp();
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function searchPhotos(e) {
        e.preventDefault();
        await loadPhotos();
    }

    async function loadPhotos() {
        try {
            const params = new URLSearchParams();
            const kw = document.getElementById('search-keyword').value;
            const tag = document.getElementById('search-tag').value;
            const sort = document.getElementById('search-sort').value;
            const order = document.getElementById('search-order').value;
            if (kw) params.append('keyword', kw);
            if (tag) params.append('tag', tag);
            params.append('sort_by', sort);
            params.append('order', order);

            const photos = await apiFetch(`/api/photos/search?${params.toString()}`);
            const grid = document.getElementById('photos-grid');
            if (!photos.length) {
                grid.innerHTML = '<div class="col-12 text-muted">Світлин поки немає.</div>';
                return;
            }
            grid.innerHTML = photos.map(p => {
                const tagsHtml = p.tags.map(t => `<span class="badge bg-secondary badge-tag">#${t.name}</span>`).join('');
                const canDelete = currentUser && (currentUser.username === p.owner_username || currentUser.role === 'admin');
                const ratingText = p.average_rating ? `${p.average_rating} ★ (${p.ratings_count})` : 'Без оцінок';
                return `
                <div class="col-md-4 mb-4">
                    <div class="card photo-card shadow-sm h-100">
                        <img src="${p.url}" class="card-img-top" alt="photo">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between small text-muted mb-1">
                                <span>@${p.owner_username}</span>
                                <span>${ratingText}</span>
                            </div>
                            <p class="card-text">${p.description || '<i>Без опису</i>'}</p>
                            <div class="mb-2">${tagsHtml}</div>
                            <div class="mt-auto d-flex gap-1 flex-wrap">
                                <button class="btn btn-sm btn-outline-primary" onclick="openDetails(${p.id}, '${p.unique_slug}')">Коментарі / QR</button>
                                ${p.owner_username !== currentUser.username ? `
                                    <button class="btn btn-sm btn-outline-warning" onclick="ratePhoto(${p.id}, 5)">5 ★</button>
                                ` : ''}
                                ${canDelete ? `<button class="btn btn-sm btn-outline-danger ms-auto" onclick="deletePhoto(${p.id})">Видалити</button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function ratePhoto(photoId, score) {
        try {
            await apiFetch(`/api/ratings/photo/${photoId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ score })
            });
            showAlert('Оцінку збережено!', 'success');
            await loadPhotos();
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function deletePhoto(photoId) {
        if (!confirm('Видалити світлину?')) return;
        try {
            await apiFetch(`/api/photos/${photoId}`, { method: 'DELETE' });
            showAlert('Світлину видалено.', 'info');
            await initApp();
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function openDetails(photoId, slug) {
        try {
            const [photo, comments] = await Promise.all([
                apiFetch(`/api/photos/${slug}`),
                apiFetch(`/api/comments/photo/${photoId}`)
            ]);
            const canModerate = currentUser && (currentUser.role === 'moderator' || currentUser.role === 'admin');
            const commentsHtml = comments.map(c => `
                <div class="border rounded p-2 mb-2 d-flex justify-content-between align-items-center">
                    <div>
                        <b>@${c.author_username}:</b> ${c.text}
                        <div class="text-muted" style="font-size: 0.75rem;">${new Date(c.created_at).toLocaleString()}</div>
                    </div>
                    ${canModerate ? `<button class="btn btn-sm btn-danger" onclick="deleteComment(${c.id}, ${photoId}, '${slug}')">Видалити</button>` : ''}
                </div>
            `).join('') || '<p class="text-muted small">Коментарів ще немає.</p>';

            document.getElementById('modal-title').textContent = `Світлина #${photoId} (@${photo.owner_username})`;
            document.getElementById('modal-body').innerHTML = `
                <div class="mb-3">
                    <h6>Трансформація Cloudinary та QR-код</h6>
                    <div class="input-group mb-2">
                        <select class="form-select" id="transform-preset">
                            <option value="grayscale">Чорно-біле (grayscale)</option>
                            <option value="sepia">Сепія (sepia)</option>
                            <option value="thumbnail_300">Мініатюра 300x300</option>
                            <option value="avatar_circle">Круглий портрет</option>
                            <option value="blur_light">Легке розмиття</option>
                        </select>
                        <button class="btn btn-outline-dark" onclick="generateQR(${photoId})">Створити QR</button>
                    </div>
                    <div id="qr-result"></div>
                </div>
                <hr>
                <h6>Коментарі</h6>
                <div class="mb-3">${commentsHtml}</div>
                <form onsubmit="addComment(event, ${photoId}, '${slug}')" class="d-flex gap-2">
                    <input type="text" class="form-control" id="new-comment-text" placeholder="Написати коментар..." required>
                    <button type="submit" class="btn btn-primary">Надіслати</button>
                </form>
            `;
            modalInstance.show();
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function generateQR(photoId) {
        try {
            const preset = document.getElementById('transform-preset').value;
            const res = await apiFetch(`/api/photos/${photoId}/transform`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ preset })
            });
            document.getElementById('qr-result').innerHTML = `
                <div class="p-2 border rounded bg-light text-center">
                    <p class="small mb-1">Відскануйте QR-код або відкрийте <a href="${res.transformed_url}" target="_blank">трансформоване фото</a>:</p>
                    <img src="${res.qr_code_endpoint}" alt="QR Code" style="width:160px;height:160px;">
                </div>
            `;
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function addComment(e, photoId, slug) {
        e.preventDefault();
        try {
            const text = document.getElementById('new-comment-text').value;
            await apiFetch(`/api/comments/photo/${photoId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            await openDetails(photoId, slug);
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    async function deleteComment(commentId, photoId, slug) {
        try {
            await apiFetch(`/api/comments/${commentId}`, { method: 'DELETE' });
            await openDetails(photoId, slug);
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    }

    initApp();
</script>
</body>
</html>
