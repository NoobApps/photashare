<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PhotoShare{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .photo-card img { height: 220px; object-fit: cover; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body hx-headers='{{ htmx_headers | tojson }}'>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">PhotoShare</a>
        <div class="d-flex align-items-center gap-2">
            {% if user %}
                <span class="text-light small me-2">{{ user.username }} ({{ user.role.value }})</span>
                <button class="btn btn-outline-light btn-sm"
                        hx-post="/ui/logout"
                        hx-target="#ui-feedback"
                        hx-swap="innerHTML">Вийти</button>
            {% else %}
                <span class="text-light small">Гість</span>
            {% endif %}
            <a href="/docs" target="_blank" class="btn btn-outline-secondary btn-sm">Swagger</a>
        </div>
    </div>
</nav>

<div class="container">
    <div id="ui-feedback"></div>
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.xhr.status >= 400) {
            let msg = 'Помилка запиту';
            try {
                const resp = JSON.parse(evt.detail.xhr.responseText);
                msg = resp.detail || msg;
            } catch (_) {}
            document.getElementById('ui-feedback').innerHTML =
                `<div class="alert alert-danger alert-dismissible fade show">${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
        }
    });
</script>
</body>
</html>
